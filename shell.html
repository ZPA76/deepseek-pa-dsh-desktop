<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DeepSeek-PA</title>
  <style>
    :root {
      --shell-bg:#141417; --shell-panel:#1d1f23; --shell-panel-2:#24262b; --shell-text:#ececec;
      --shell-muted:#9ea0a3; --shell-accent:#5b9bff; --shell-accent-strong:#3f78f2;
      --shell-line:rgba(255,255,255,.12); --shell-hover:#292b31; --shell-active:#32353c;
      --shell-danger:#ff7474;
      --ui-font-family:"Segoe UI Variable Text","Microsoft YaHei UI","Segoe UI",sans-serif;
      --ui-font-size:14px; --ui-line-height:1.5; color-scheme:dark;
      --wallpaper-image:none; --wallpaper-size:cover; --wallpaper-position:center; --wallpaper-repeat:no-repeat; --wallpaper-opacity:.28; --wallpaper-blur:0px; --wallpaper-overlay:.42;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { display:flex; flex-direction:column; font:var(--ui-font-size)/var(--ui-line-height) var(--ui-font-family); background:var(--shell-bg); color:var(--shell-text); overflow:hidden; }
    body::before,body::after { content:""; position:fixed; inset:-24px; pointer-events:none; display:none; }
    body::before { z-index:0; background-image:var(--wallpaper-image); background-size:var(--wallpaper-size); background-position:var(--wallpaper-position); background-repeat:var(--wallpaper-repeat); opacity:var(--wallpaper-opacity); filter:blur(var(--wallpaper-blur)); }
    body::after { z-index:0; background:var(--shell-bg); opacity:var(--wallpaper-overlay); }
    html[data-dpa-wallpaper="true"] body::before,html[data-dpa-wallpaper="true"] body::after { display:block; }
    body > * { position:relative; z-index:1; }
    .topbar { min-height:60px; flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:10px 22px; background:var(--shell-panel); border-bottom:1px solid var(--shell-line); user-select:none; }
    .brand { color:var(--shell-text); font-size:15px; font-weight:650; letter-spacing:-.01em; margin-right:28px; display:flex; align-items:center; gap:10px; white-space:nowrap; }
    .brand img { width:28px; height:28px; object-fit:contain; }
    .brand svg { width:18px; height:18px; }
    .brand-mark { fill:var(--shell-accent); }
    .tab { display:inline-flex; align-items:center; gap:8px; min-height:38px; padding:8px 15px; border:1px solid transparent; border-radius:9px; background:transparent; cursor:pointer; color:var(--shell-muted); font:550 max(12px,calc(var(--ui-font-size) - 1px))/1.5 var(--ui-font-family); transition:background .15s,color .15s; white-space:nowrap; }
    .tab svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; }
    .tab:hover { background:var(--shell-hover); color:var(--shell-text); }
    .tab.active { background:color-mix(in srgb,var(--shell-accent) 12%,var(--shell-panel)); color:var(--shell-accent); border-color:color-mix(in srgb,var(--shell-accent) 22%,var(--shell-line)); }
    button:focus-visible { outline:2px solid var(--shell-accent); outline-offset:3px; }
    .spacer { flex:1; }
    .update-button { border:1px solid var(--shell-line); border-radius:8px; padding:6px 11px; background:transparent; color:var(--shell-muted); font: max(11px,calc(var(--ui-font-size) - 2px))/1.5 var(--ui-font-family); cursor:pointer; white-space:nowrap; }
    .update-button:hover { color:var(--shell-text); border-color:var(--shell-accent); }
    .update-button.available { color:#fff; background:var(--shell-accent-strong); border-color:var(--shell-accent); }
    .update-button.error { color:var(--shell-danger); border-color:var(--shell-danger); }
    .update-button:disabled { cursor:wait; opacity:.72; }
    .content { flex:1; min-height:0; position:relative; background:var(--shell-bg); }
    webview,iframe { position:absolute; inset:0; border:0; width:100%; height:100%; background:var(--shell-bg); }
    .hidden { display:none; }
    @media(max-width:850px) { .topbar { gap:4px; padding:9px 12px; } .brand { margin-right:10px; font-size:13px; gap:7px; } .tab { padding:7px 10px; } .update-button { max-width:150px; overflow:hidden; text-overflow:ellipsis; } }
    @media(max-width:640px) { .brand { font-size:0; margin-right:4px; } .brand img { width:25px; height:25px; } .tab { gap:5px; padding:7px 8px; } .tab svg { width:15px; height:15px; } }
    @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><img src="icon.png" alt="">DeepSeek-PA</div>
    <button class="tab active" id="tab-agent" data-mode="agent" type="button" aria-label="Agent 智能体工作台"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="4"/><path d="M12 3v4M8 12h.01M16 12h.01M9 16h6"/></svg>Agent</button>
    <button class="tab" id="tab-chat" data-mode="chat" type="button" aria-label="Chat 对话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 1 1 18 0Z"/><path d="M7 9h9M7 13h6"/></svg>Chat</button>
    <button class="tab" id="tab-cluster" data-mode="cluster" type="button" aria-label="集群协作"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="6" rx="2"/><rect x="2" y="16" width="7" height="6" rx="2"/><rect x="15" y="16" width="7" height="6" rx="2"/><path d="M12 8v4M5.5 16v-4h13v4"/></svg>集群</button>
    <button class="tab" id="tab-capabilities" data-mode="capabilities" type="button" aria-label="扩展中心"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M17.5 14v7M14 17.5h7"/></svg>扩展中心</button>
    <div class="spacer"></div>
    <button class="update-button" id="dsh-update" type="button">DSH 检查更新</button>
  </div>
  <div class="content">
    <webview id="view" src="about:blank"></webview>
    <iframe id="cluster" class="hidden" src="cluster.html"></iframe>
    <iframe id="capabilities" class="hidden" src="capabilities.html"></iframe>
  </div>

  <script>
    const view = document.getElementById('view')
    const clusterFrame = document.getElementById('cluster')
    const capabilitiesFrame = document.getElementById('capabilities')
    const LOCAL_FILE_TARGET_ORIGIN = 'file://'
    const LOCAL_FILE_EVENT_ORIGIN = 'null'
    const CLUSTER_FRAME_URL = new URL('cluster.html', window.location.href).href
    const CAPABILITIES_FRAME_URL = new URL('capabilities.html', window.location.href).href
    const LOCAL_AGENT_URL = 'http://127.0.0.1:3080/'
    const CHAT_URL = 'https://chat.deepseek.com/'
    let agentUrl = LOCAL_AGENT_URL
    let activeMode = 'agent'
    let currentTheme = null
    let currentAppearance = null
    let dshThemeCssKey = null
    let webviewReady = false
    const webviewReadyPromise = new Promise((resolve) => {
      view.addEventListener('dom-ready', () => { webviewReady = true; resolve() }, { once:true })
    })

    function isExpectedLocalFrame(frame, expectedUrl) {
      try { return frame.contentWindow.location.href === expectedUrl }
      catch (_) { return false }
    }

    function isTrustedLocalFrameMessage(event, frame, expectedUrl) {
      return event.origin === LOCAL_FILE_EVENT_ORIGIN && event.source === frame.contentWindow && isExpectedLocalFrame(frame, expectedUrl)
    }

    function postToLocalFrame(frame, expectedUrl, message) {
      if (!isExpectedLocalFrame(frame, expectedUrl)) return false
      try { frame.contentWindow.postMessage(message, LOCAL_FILE_TARGET_ORIGIN); return true }
      catch (_) { return false }
    }

    function normalizeLocalAgentUrl(value) {
      try {
        const candidate = new URL(String(value || LOCAL_AGENT_URL))
        if (candidate.origin !== new URL(LOCAL_AGENT_URL).origin || candidate.pathname !== '/') return LOCAL_AGENT_URL
        return candidate.toString()
      } catch (_) {
        return LOCAL_AGENT_URL
      }
    }

    async function loadAgentUrl(value) {
      agentUrl = normalizeLocalAgentUrl(value)
      await webviewReadyPromise
      try { await view.loadURL(agentUrl) } catch (_) {}
    }

    function switchTo(mode) {
      activeMode = mode
      const localFrame = mode === 'cluster' || mode === 'capabilities'
      for (const name of ['agent','chat','cluster','capabilities']) document.getElementById(`tab-${name}`).classList.toggle('active', mode === name)
      if (localFrame) {
        view.classList.add('hidden')
        clusterFrame.classList.toggle('hidden', mode !== 'cluster')
        capabilitiesFrame.classList.toggle('hidden', mode !== 'capabilities')
        return
      }
      clusterFrame.classList.add('hidden'); capabilitiesFrame.classList.add('hidden'); view.classList.remove('hidden')
      if (!webviewReady) {
        webviewReadyPromise.then(() => { if (activeMode === mode) switchTo(mode) }).catch(() => {})
        return
      }
      if (mode === 'agent') {
        try {
          if (new URL(view.getURL()).origin === new URL(LOCAL_AGENT_URL).origin) return
        } catch (_) {}
        loadAgentUrl(agentUrl)
        return
      }
      if (view.getURL() !== CHAT_URL) view.loadURL(CHAT_URL).catch(() => {})
    }
    for (const name of ['agent','chat','cluster','capabilities']) document.getElementById(`tab-${name}`).addEventListener('click', () => switchTo(name))

    const serverAPI = window.harnessDesktop && window.harnessDesktop.server
    if (serverAPI) {
      serverAPI.onAuthenticatedUrl((url) => {
        agentUrl = normalizeLocalAgentUrl(url)
        if (activeMode === 'agent') loadAgentUrl(agentUrl)
      })
      serverAPI.authenticatedUrl().then((url) => loadAgentUrl(url)).catch(() => loadAgentUrl(LOCAL_AGENT_URL))
    } else {
      loadAgentUrl(LOCAL_AGENT_URL)
    }

    function injectCodex(attempt) {
      if (!webviewReady) return
      try {
        const url = view.getURL() || ''
        if (!url.startsWith('http://127.0.0.1')) return
        if (window.__codexCSS) { view.insertCSS(window.__codexCSS).catch(() => {}); return }
        if (attempt < 20) setTimeout(() => injectCodex(attempt + 1), 300)
      } catch (_) {}
    }

    function dshThemeCss(theme, typography = {}, background = {}) {
      const dsh = theme.dshTokens || {}
      const declarations = Object.entries(dsh).map(([name,value]) => `${name}:${value}`).join(';')
      const scheme = theme.colorScheme === 'light' ? 'light' : 'dark'
      const family = typography.fontFamily || '"Segoe UI Variable Text","Microsoft YaHei UI","Segoe UI",sans-serif'
      const size = Number(typography.fontSize || 14)
      const lineHeight = Number(typography.lineHeight || 1.5)
      const enabled = Boolean(background.enabled && background.dataUrl)
      const fit = background.fit === 'repeat' ? 'auto' : (background.fit || 'cover')
      const repeat = background.fit === 'repeat' ? 'repeat' : 'no-repeat'
      const image = enabled ? `linear-gradient(color-mix(in srgb,var(--dsw-alias-bg-base) ${Math.round(Number(background.overlay || 0) * 100)}%,transparent),color-mix(in srgb,var(--dsw-alias-bg-base) ${Math.round(Number(background.overlay || 0) * 100)}%,transparent)),url("${background.dataUrl}")` : 'none'
      return `:root,body{${declarations};color-scheme:${scheme}!important}body{background-color:var(--dsw-alias-bg-base)!important;background-image:${image}!important;background-size:${fit}!important;background-position:${background.position || 'center'}!important;background-repeat:${repeat}!important;color:var(--dsw-alias-label-primary)!important;font-family:${family}!important;font-size:${size}px!important;line-height:${lineHeight}!important}`
    }

    async function injectThemeToHarness(theme) {
      if (!webviewReady) return
      try {
        if (!(view.getURL() || '').startsWith('http://127.0.0.1')) return
        if (dshThemeCssKey) await view.removeInsertedCSS(dshThemeCssKey).catch(() => {})
        dshThemeCssKey = await view.insertCSS(dshThemeCss(theme, currentAppearance && currentAppearance.typography, currentAppearance && currentAppearance.background))
      } catch (_) {}
    }

    view.addEventListener('dom-ready', () => {
      try {
        const current = new URL(view.getURL())
        if (current.origin === new URL(LOCAL_AGENT_URL).origin && !current.searchParams.has('token')) agentUrl = LOCAL_AGENT_URL
      } catch (_) {}
      injectCodex(0)
      if (currentTheme) injectThemeToHarness(currentTheme)
    })

    const clusterAPI = window.harnessDesktop && window.harnessDesktop.cluster
    if (clusterAPI) {
      window.addEventListener('message', async (event) => {
        const data = event.data || {}
        if (!isTrustedLocalFrameMessage(event, clusterFrame, CLUSTER_FRAME_URL) || data.type !== 'cluster:request') return
        try { postToLocalFrame(clusterFrame, CLUSTER_FRAME_URL, { type:'cluster:response', id:data.id, result:await clusterAPI.request(data.method, data.payload) }) }
        catch (error) { postToLocalFrame(clusterFrame, CLUSTER_FRAME_URL, { type:'cluster:response', id:data.id, error:String(error && error.message || error) }) }
      })
      clusterAPI.onEvent((event) => { postToLocalFrame(clusterFrame, CLUSTER_FRAME_URL, { type:'cluster:event', payload:event }) })
    }

    const capabilityAPI = window.harnessDesktop && window.harnessDesktop.capability
    function applyDpaAppearance(appearance) {
      if (!appearance || !appearance.theme) return
      currentAppearance = appearance
      currentTheme = appearance.theme
      const theme = appearance.theme
      const typography = appearance.typography || {}
      const tokens = theme.tokens || {}
      const mapping = { background:'--shell-bg', panel:'--shell-panel', panel2:'--shell-panel-2', text:'--shell-text', muted:'--shell-muted', accent:'--shell-accent', accentStrong:'--shell-accent-strong', line:'--shell-line', hover:'--shell-hover', active:'--shell-active', danger:'--shell-danger' }
      document.documentElement.dataset.dpaTheme = theme.id || 'midnight'
      document.documentElement.style.colorScheme = theme.colorScheme || 'dark'
      for (const [key, variable] of Object.entries(mapping)) if (tokens[key]) document.documentElement.style.setProperty(variable, tokens[key])
      document.documentElement.style.setProperty('--ui-font-family', typography.fontFamily || '"Segoe UI Variable Text","Microsoft YaHei UI","Segoe UI",sans-serif')
      document.documentElement.style.setProperty('--ui-font-size', String(typography.fontSize || 14) + 'px')
      document.documentElement.style.setProperty('--ui-line-height', String(typography.lineHeight || 1.5))
      const background = appearance.background || {}
      const wallpaperEnabled = Boolean(background.enabled && background.dataUrl)
      document.documentElement.dataset.dpaWallpaper = wallpaperEnabled ? 'true' : 'false'
      document.documentElement.style.setProperty('--wallpaper-image', wallpaperEnabled ? `url("${background.dataUrl}")` : 'none')
      document.documentElement.style.setProperty('--wallpaper-size', background.fit === 'repeat' ? 'auto' : (background.fit || 'cover'))
      document.documentElement.style.setProperty('--wallpaper-repeat', background.fit === 'repeat' ? 'repeat' : 'no-repeat')
      document.documentElement.style.setProperty('--wallpaper-position', background.position || 'center')
      document.documentElement.style.setProperty('--wallpaper-opacity', String(background.opacity == null ? .28 : background.opacity))
      document.documentElement.style.setProperty('--wallpaper-blur', String(background.blur || 0) + 'px')
      document.documentElement.style.setProperty('--wallpaper-overlay', String(background.overlay == null ? .42 : background.overlay))
      try { view.setZoomFactor(Math.min(2, Math.max(.8, Number(typography.zoom || 100) / 100))) } catch (_) {}
      postToLocalFrame(clusterFrame, CLUSTER_FRAME_URL, { type:'capability:appearance', appearance })
      postToLocalFrame(capabilitiesFrame, CAPABILITIES_FRAME_URL, { type:'capability:appearance', appearance })
      injectThemeToHarness(theme)
    }

    function applyDpaTheme(theme) {
      const base = currentAppearance || { typography:{} }
      applyDpaAppearance({ ...base, theme })
    }

    async function stepAppearance(direction) {
      if (!capabilityAPI || !currentAppearance) return
      const typography = currentAppearance.typography || {}
      if (typography.ctrlWheel === 'off') return
      const payload = typography.ctrlWheel === 'font'
        ? { fontSize:Math.min(22, Math.max(12, Number(typography.fontSize || 14) + direction)) }
        : { zoom:Math.min(200, Math.max(80, Number(typography.zoom || 100) + direction * 5)) }
      const appearance = await capabilityAPI.request('setTypography', payload)
      applyDpaAppearance(appearance)
    }

    window.addEventListener('message', async (event) => {
      const data = event.data || {}
      const fromCapabilities = isTrustedLocalFrameMessage(event, capabilitiesFrame, CAPABILITIES_FRAME_URL)
      const fromCluster = isTrustedLocalFrameMessage(event, clusterFrame, CLUSTER_FRAME_URL)
      if (!fromCapabilities && !fromCluster) return
      if (fromCapabilities && data.type === 'capability:request' && capabilityAPI) {
        try { postToLocalFrame(capabilitiesFrame, CAPABILITIES_FRAME_URL, { type:'capability:response', id:data.id, result:await capabilityAPI.request(data.method, data.payload) }) }
        catch (error) { postToLocalFrame(capabilitiesFrame, CAPABILITIES_FRAME_URL, { type:'capability:response', id:data.id, error:String(error && error.message || error) }) }
      }
      if (fromCapabilities && data.type === 'capability:theme' && data.theme) applyDpaTheme(data.theme)
      if (fromCapabilities && data.type === 'capability:appearance' && data.appearance) applyDpaAppearance(data.appearance)
      if (data.type === 'capability:zoom-step') stepAppearance(Number(data.direction) < 0 ? -1 : 1).catch(() => {})
      if (data.type === 'capability:appearance-request' && currentAppearance) {
        postToLocalFrame(fromCapabilities ? capabilitiesFrame : clusterFrame, fromCapabilities ? CAPABILITIES_FRAME_URL : CLUSTER_FRAME_URL, { type:'capability:appearance', appearance:currentAppearance })
      }
    })
    if (capabilityAPI) capabilityAPI.request('themeState').then(applyDpaAppearance).catch(() => {})

    const updateButton = document.getElementById('dsh-update')
    const updateAPI = window.harnessDesktop && window.harnessDesktop.update
    function renderUpdateState(state) {
      if (!state || !updateButton) return
      updateButton.classList.toggle('available', state.status === 'available')
      updateButton.classList.toggle('error', state.status === 'error' || state.status === 'server-error')
      updateButton.disabled = state.status === 'checking' || state.status === 'installing'
      if (state.status === 'checking') updateButton.textContent = '正在检查 DSH…'
      else if (state.status === 'installing') updateButton.textContent = state.message || '正在更新 DSH…'
      else if (state.status === 'available') updateButton.textContent = `可更新至 ${state.latestVersion}`
      else if (['complete','current','idle'].includes(state.status)) updateButton.textContent = `DSH ${state.currentVersion || state.version || ''}`
      else if (state.status === 'error' || state.status === 'server-error') updateButton.textContent = 'DSH 更新异常'
    }
    if (updateAPI) {
      updateButton.addEventListener('click', () => updateAPI.check().catch(() => {}))
      updateAPI.status().then(renderUpdateState).catch(() => {})
      updateAPI.onState(renderUpdateState)
    } else updateButton.hidden = true
  </script>
</body>
</html>
