name: Bug report
description: Report a reproducible DPA problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove API keys, tokens, private project data and local credentials before submitting."
  - type: input
    id: dpa-version
    attributes:
      label: DPA version
      placeholder: "例如：0.6.1 / e.g. 0.6.1"
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      placeholder: "0.1.1-rc.2"
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest reliable reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
    validations:
      required: true
