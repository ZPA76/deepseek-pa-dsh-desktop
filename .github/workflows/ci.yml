name: DPA checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpa-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Audit public export
        run: node scripts/public-export-audit.js
      - name: Install dependencies
        run: npm ci
      - name: Audit dependency advisories
        if: runner.os == 'Linux'
        run: npm audit --audit-level=high
      - name: Syntax checks
        run: npm run check
      - name: Unit and integration tests
        run: npm test
